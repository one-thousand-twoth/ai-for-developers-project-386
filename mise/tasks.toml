[build]
description = "Собрать сервер"
run = "go build -o bin/server ./cmd/server"

[test]
description = "Запустить тесты"
run = "go test ./..."

[run]
description = "Запустить сервер"
run = "go run ./cmd/server"

[lint]
description = "Проверить код с помощью golangci-lint"
run = "golangci-lint run ./..."

["lint:fix"]
description = "Исправить замечания golangci-lint автоматически"
run = "golangci-lint run --fix ./..."

["web:install"]
description = "Установить зависимости workspace"
run = "pnpm install --frozen-lockfile"

["web:dev"]
description = "Запустить фронтенд в режиме разработки"
dir = "{{config_root}}/web"
run = "pnpm dev"

["web:build"]
description = "Проверить TypeScript и собрать фронтенд"
dir = "{{config_root}}/web"
run = "pnpm build"

["web:lint"]
description = "Проверить код фронтенда"
dir = "{{config_root}}/web"
run = "pnpm lint"

["web:preview"]
description = "Просмотреть сборку фронтенда"
dir = "{{config_root}}/web"
run = "pnpm preview"

[install]
description = "Установить зависимости workspace и Go"
run = ["pnpm install --frozen-lockfile", "go mod download"]

["generate:typespec"]
run = "pnpm exec tsp compile typespec"

["generate:backend"]
run = "go tool ogen --config .ogen.yml --target gen/api --package api --clean openapi/openapi.json"

["generate:frontend"]
run = "pnpm exec openapi-ts"

[generate]
description = "Сгенерировать OpenAPI, Go и TypeScript"
run = ["mise run generate:typespec", "mise run generate:backend", "mise run generate:frontend"]

["generate:check"]
description = "Проверить актуальность и повторяемость артефактов"
run = "node mise/generate-check.mjs"
