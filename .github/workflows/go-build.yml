name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Build server
        run: mise run build
